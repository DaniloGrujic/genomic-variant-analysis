
name: AWS Authentication Test

on:
  workflow_dispatch:

jobs:
  test-aws:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify ECS access
        run: aws ecs describe-services --cluster variant-api-cluster --services variant-api-service --region eu-north-1 --query "services[0].{Status:status,Running:runningCount,Desired:desiredCount}" --output table

      - name: Verify ECR authentication
        run: aws ecr get-login-password --region eu-north-1 > /dev/null
